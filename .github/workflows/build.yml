name: Build Twinclers Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nuitka
    - name: Build Executable with Nuitka
      run: |
        call build_scripts\build_nuitka.bat
    - name: Compile Inno Setup Installer
      run: |
        "C:\Program Files (x86)\Inno Setup 6\iscc.exe" build_scripts\setup.iss
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TwinclersGuard-Installer
        path: Output/*.exe
